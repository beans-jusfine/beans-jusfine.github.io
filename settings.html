<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>beans ツ - Settings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Press+Start+2P&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
    <noscript><style>body { opacity: 1 !important; }</style></noscript>
</head>
<body>

    <nav class="nav-bar">
        <a href="index.html" class="nav-item" data-i18n="navHome">🏠 Home</a>
        <a href="devices.html" class="nav-item" data-i18n="navDevices">Devices</a>
        <a href="beans-stuff.html" class="nav-item nav-secret" data-i18n="navBeansStuff">🫘 Beans Stuff</a>
        <a href="settings.html" class="nav-item active" data-i18n="navSettings">Settings</a>
    </nav>

    <div class="dashboard-container">
        
        <main class="content-stream">
            
            <section class="dash-box">
                <h3 class="box-title" data-i18n="titleVisual">Visual Settings</h3>
                <div class="settings-list">
                    
                    <div class="setting-row">
                        <span data-i18n="setDarkMode">Dark Mode</span>
                        <label class="switch">
                            <input type="checkbox" id="dark-mode" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="setting-row">
                        <span data-i18n="setFigcaptions">Show Figcaptions</span>
                        <label class="switch">
                            <input type="checkbox" id="show-figcaptions" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="setting-row">
                        <span data-i18n="setSmallPagebar">Small Pagebar</span>
                        <label class="switch">
                            <input type="checkbox" id="small-pagebar">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="setting-row">
                        <span data-i18n="setBoldFont">Bold Font</span>
                        <label class="switch">
                            <input type="checkbox" id="bold-font">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="setting-row">
                        <span data-i18n="setFont">Font</span>
                        <select id="font-select" class="dropdown-control">
                            <option value="google-sans">Google Sans</option>
                            <option value="plus-jakarta" selected>Plus Jakarta</option>
                            <option value="inter">Inter</option>
                            <option value="pixel">8-Bit</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <span data-i18n="setLanguage">Language</span>
                        <select id="language-select" class="dropdown-control">
                            <option value="en" selected>English</option>
                            <option value="es">Español</option>
                            <option value="fr">Français</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <span data-i18n="setPagebarPos">Pagebar Position</span>
                        <select id="pagebar-position" class="dropdown-control">
                            <option value="top" selected data-i18n="posTop">Top</option>
                            <option value="bottom" data-i18n="posBottom">Bottom</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <span data-i18n="setWallpaper">Wallpaper</span>
                        <select id="wallpaper-select" class="dropdown-control">
                            <option value="default" selected data-i18n="wpDefault">Default</option>
                            <option value="clouds" data-i18n="wpClouds">Clouds</option>
                            <option value="dark" data-i18n="wpDark">Dark Solid</option>
                            <option value="beans" data-i18n="wpBeans">Beans</option>
                            <option value="black-beans" data-i18n="wpBlackBeans">Black Beans</option>
                            <option value="onn-peak">onn is peak vro</option>
                            <option value="blue" data-i18n="wpBlue">Blue Wallpaper</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <span data-i18n="setAccent">Accent Color</span>
                        <select id="accent-color" class="dropdown-control">
                            <option value="orange" selected data-i18n="accOrange">Bean Orange</option>
                            <option value="blue" data-i18n="accBlue">Blue</option>
                            <option value="purple" data-i18n="accPurple">Purple</option>
                            <option value="black" data-i18n="accBlack">Black</option>
                        </select>
                    </div>

                </div>
            </section>

            <section class="dash-box">
                <h3 class="box-title" data-i18n="titlePerformance">Performance Settings</h3>
                <div class="settings-list">
                    
                    <div class="setting-row">
                        <span data-i18n="setBlur">Blur Effect</span>
                        <label class="switch">
                            <input type="checkbox" id="blur-effect" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="setting-row">
                        <span data-i18n="setWallpaperBlur">Wallpaper Blur</span>
                        <label class="switch">
                            <input type="checkbox" id="wallpaper-blur" checked>
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="setting-row">
                        <span data-i18n="setReducedAnim">Reduced Animation</span>
                        <label class="switch">
                            <input type="checkbox" id="reduced-animation">
                            <span class="slider"></span>
                        </label>
                    </div>

                    <div class="setting-row">
                        <span data-i18n="setLowEnd">Low-End Mode</span>
                        <label class="switch">
                            <input type="checkbox" id="low-end-mode">
                            <span class="slider"></span>
                        </label>
                    </div>

                </div>
            </section>

            <section class="dash-box">
                <h3 class="box-title" data-i18n="titleExperimental">Experimental Settings</h3>
                <div class="settings-list">
                    <div class="setting-row">
                        <span data-i18n="setExperimental">Experimental Features</span>
                        <label class="switch">
                            <input type="checkbox" id="experimental-features">
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <script src="./settings.js"></script>
    <script>
        (function () {
            function ready(fn) {
                if (document.readyState !== 'loading') fn();
                else document.addEventListener('DOMContentLoaded', fn);
            }

            ready(function () {
                const settings = window.beansSettings.load();

                function bindCheckbox(id, key) {
                    const el = document.getElementById(id);
                    if (!el) return;
                    el.checked = !!settings[key];
                    el.addEventListener('change', function () {
                        settings[key] = el.checked;
                        commit();
                    });
                }

                function bindSelect(id, key) {
                    const el = document.getElementById(id);
                    if (!el) return;
                    el.value = settings[key];
                    el.addEventListener('change', function () {
                        settings[key] = el.value;
                        commit();
                    });
                }

                function commit() {
                    window.beansSettings.save(settings);
                    window.beansSettings.apply(settings);
                    syncLowEndUI();
                }

                function syncLowEndUI() {
                    const forced = !!settings.lowEndMode;
                    ['blur-effect', 'wallpaper-blur', 'reduced-animation'].forEach(function (id) {
                        const el = document.getElementById(id);
                        if (el) el.disabled = forced;
                    });
                }

                bindCheckbox('dark-mode', 'darkMode');
                bindCheckbox('show-figcaptions', 'showFigcaptions');
                bindCheckbox('small-pagebar', 'smallPagebar');
                bindCheckbox('bold-font', 'boldFont');
                bindSelect('font-select', 'font');
                bindSelect('language-select', 'language');
                bindSelect('pagebar-position', 'pagebarPosition');
                bindSelect('wallpaper-select', 'wallpaper');
                bindSelect('accent-color', 'accentColor');
                bindCheckbox('blur-effect', 'blurEffect');
                bindCheckbox('wallpaper-blur', 'wallpaperBlur');
                bindCheckbox('reduced-animation', 'reducedAnimation');
                bindCheckbox('low-end-mode', 'lowEndMode');
                bindCheckbox('experimental-features', 'experimentalFeatures');

                syncLowEndUI();
                window.beansSettings.apply(settings);
            });
        })();
    </script>

</body>
</html>
