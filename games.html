<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>beans ツ - Games</title>
    <meta name="description" content="beans games.">
    <meta name="theme-color" content="#a34b25">
    <link rel="icon" type="image/png" href="icons/pfp.png">
    <link rel="apple-touch-icon" href="icons/pfp.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Press+Start+2P&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./style.css">
    <noscript><style>body { opacity: 1 !important; }</style></noscript>
</head>
<body>
    <nav class="nav-bar">
        <a href="/" class="nav-item" data-i18n="navHome">🏠 Home</a>
        <a href="devices.html" class="nav-item" data-i18n="navDevices">Devices</a>
        <a href="beans-stuff.html" class="nav-item nav-secret" data-i18n="navBeansStuff">🫘 Beans Stuff</a>
        <a href="settings.html" class="nav-item" data-i18n="navSettings">Settings</a>
        <a href="games.html" class="nav-item nav-games active" data-i18n="navGames">🎮 Games</a>
    </nav>

    <div class="dashboard-container">
        <main class="content-stream">
            <section class="dash-box">
                <h3 class="box-title" data-i18n="titleGame">Bean Catcher</h3>
                <canvas id="bean-game" class="bean-game-canvas" tabindex="0" aria-label="Bean Catcher game"></canvas>
                <p class="bean-game-help" data-i18n="gameInstructions">Catch the beans, dodge the peppers. Move with your mouse, your finger, or the ← → keys.</p>
                <div class="bean-game-controls">
                    <button type="button" id="bean-game-start" class="btn-link" data-i18n="gameStart">Play</button>
                </div>
            </section>

            <section class="dash-box">
                <h3 class="box-title">Drift Boss</h3>
                <p class="bean-game-help">Open Drift Boss in a full-page about:blank tab.</p>

                <div class="bean-game-controls">
                    <button type="button" id="drift-boss-play" class="btn-link">▶ Play Drift Boss</button>
                </div>
            </section>
        </main>
    </div>

    <script src="./settings.js"></script>
    <script src="./bean-game.js"></script>
    <script>
        (function () {
            const button = document.getElementById('drift-boss-play');
            if (!button) return;

            button.addEventListener('click', function () {
                const gameWindow = window.open('about:blank', '_blank');
                if (!gameWindow) {
                    window.location.href = 'https://driftboss.io/drift-boss.embed';
                    return;
                }

                gameWindow.document.title = 'Drift Boss';
                gameWindow.document.body.style.margin = '0';
                gameWindow.document.body.style.width = '100vw';
                gameWindow.document.body.style.height = '100vh';
                gameWindow.document.body.style.overflow = 'hidden';

                const frame = gameWindow.document.createElement('iframe');
                frame.src = 'https://driftboss.io/drift-boss.embed';
                frame.title = 'Drift Boss';
                frame.allow = 'autoplay; fullscreen; gamepad';
                frame.allowFullscreen = true;
                frame.style.cssText = 'position:fixed; inset:0; width:100%; height:100%; border:0;';

                gameWindow.document.body.appendChild(frame);
            });
        })();
    </script>
</body>
</html>
